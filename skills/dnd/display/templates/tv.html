<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="dnd-token" content="{{ lan_token }}">
<meta name="narrator-voice" content="{{ narrator_voice }}">
<meta name="voice-on" content="{{ '1' if voice_on else '0' }}">
<meta name="voice-local" content="{{ '1' if voice_local else '0' }}">
<meta name="voice-reason" content="{{ voice_reason }}">
<title>DnD — TV</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/app_icon_32.png">
<link rel="stylesheet" href="/static/tv/tokens.css">
<link rel="stylesheet" href="/static/tv/tv.css">
<link rel="stylesheet" href="/static/tv/scene.css">
</head>
<body>
<main id="tv-stage" class="stage" data-mode="story">
  <!-- Background (foundation D14): the scene's gradient, sky and mood layer
       (scene backgrounds spec D1), driven by bg.js and mood.js. -->
  <div id="tv-bg" aria-hidden="true">
    <div id="bg-a" class="bg-layer"></div>
    <div id="bg-b" class="bg-layer"></div>
    <canvas id="sky"></canvas>
    <canvas id="particles"></canvas>
  </div>
  <div class="vig" aria-hidden="true"></div>

  <div id="tv-layer" class="layer">
    <aside id="tv-side-l" class="side side-l" aria-label="Left panel"></aside>
    <div id="scene-indicator" class="scene">— The Inn —</div>
    <div id="tv-turnbar" class="turnbar" hidden aria-label="Turn order"></div>
    <div id="tv-map" class="mapbox" hidden aria-label="Battle map"></div>
    <div id="tv-party" class="party" hidden aria-label="Party"></div>
    <section id="tv-feed" class="feed" aria-label="Story" aria-live="polite"></section>
    <div id="tv-inputbar" class="inputbar" aria-live="polite"></div>
    <aside id="tv-side-r" class="side side-r" aria-label="Right panel"></aside>
  </div>

  <div id="tv-devices" class="devices" hidden aria-label="Phones asking to join"></div>
  <div id="tv-reconnect" class="reconnect" hidden role="status">Reconnecting…</div>
  <button id="tv-tap-audio" class="tap-audio" type="button" hidden aria-label="Turn on narration audio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    <span>Tap for audio</span>
  </button>
</main>
<script src="/static/tv/tv-boot.js"></script>
<script src="/static/tv/stream.js"></script>
<script src="/static/tv/voice.js"></script>
<script src="/static/tv/feed.js"></script>
<script src="/static/tv/devices.js"></script>
<script src="/static/tv/layout.js"></script>
<script src="/static/tv/panels.js"></script>
<script src="/static/tv/map.js"></script>
<script src="/static/tv/mood.js"></script>
<script src="/static/tv/bg.js"></script>
<script src="/static/tv/tv.js"></script>
</body>
</html>
