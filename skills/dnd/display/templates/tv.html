<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="dnd-token" content="{{ lan_token }}">
<meta name="narrator-voice" content="{{ narrator_voice }}">
<meta name="voice-on" content="{{ '1' if voice_on else '0' }}">
<meta name="voice-local" content="{{ '1' if voice_local else '0' }}">
<meta name="voice-reason" content="{{ voice_reason }}">
<title>DnD — TV</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/app_icon_32.png">
<link rel="stylesheet" href="/static/tv/tokens.css">
<link rel="stylesheet" href="/static/tv/tv.css">
</head>
<body>
<main id="tv-stage" class="stage" data-mode="story">
  <!-- Background (D14): the old page's scene layers, a placeholder until the
       Scene backgrounds spec. Driven by bg.js. -->
  <div id="tv-bg" aria-hidden="true">
    <div id="bg-a" class="bg-layer"></div>
    <div id="bg-b" class="bg-layer"></div>
    <canvas id="sky"></canvas>
    <canvas id="particles"></canvas>
  </div>
  <div class="vig" aria-hidden="true"></div>

  <div id="tv-layer" class="layer">
    <div id="scene-indicator" class="scene">— The Inn —</div>
    <section id="tv-feed" class="feed" aria-label="Story" aria-live="polite"></section>
  </div>

  <div id="tv-devices" class="devices" hidden aria-label="Phones asking to join"></div>
  <div id="tv-reconnect" class="reconnect" hidden role="status">Reconnecting…</div>
</main>
<script src="/static/tv/tv-boot.js"></script>
<script src="/static/tv/stream.js"></script>
<script src="/static/tv/feed.js"></script>
<script src="/static/tv/devices.js"></script>
<script src="/static/tv/bg.js"></script>
<script src="/static/tv/tv.js"></script>
</body>
</html>
